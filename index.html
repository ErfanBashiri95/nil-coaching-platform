<!DOCTYPE html>

<head>
    <style>
        body {
            font-family: sans-serif;
            direction: rtl;
            margin: 0;
            background: #f9fafb;
        }

        /* Container */
        .page {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        /* Hero */
        .hero {
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
            color: white;
            padding: 60px 30px;
            border-radius: 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero p {
            opacity: 0.9;
            margin-bottom: 20px;
        }

        /* Buttons */
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn:hover {
            background: #1e40af;
        }

        .btn-light {
            background: white;
            color: #1e3a8a;
        }

        /* Cards */
        .course-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .course-card {
            flex: 1;
            min-width: 250px;
            background: white;
            padding: 20px;
            border-radius: 16px;
            transition: 0.2s;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        /* Section title */
        .section-title {
            margin-top: 50px;
            font-size: 24px;
        }

        /* Badge */
        .badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
        }

        /* Modal */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 300px;
        }
    </style>

    <meta charset="UTF-8" />
